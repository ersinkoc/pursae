version: "2"

# Cheap, mechanical checks on top of go vet (which CI already runs). Bugs only: style linters stay off
# so the report is about defects, not formatting taste.
run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet         # go vet, incl. shadowed copylocks, printf
    - staticcheck   # bugs, deprecated APIs, simplifications (SA/S/ST/QF)
    - errcheck      # unchecked errors
    - ineffassign   # assignments never read
    - unused        # dead code
    - bodyclose     # http response bodies left open
    - rowserrcheck  # sql rows.Err() not checked
    - sqlclosecheck # sql rows/statements not closed
    - nilerr        # returning nil when err != nil
    - errorlint     # == on wrapped errors
    - gosec         # security: SQL concatenation, path traversal, weak crypto
    - durationcheck # two durations multiplied
    - copyloopvar
  settings:
    staticcheck:
      checks: ["SA*"] # bugs only; style (ST), simplifications (S) and quick fixes (QF) are taste
    errcheck:
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers it
        - G304 # file path from variable: paths are built from config and checked where they come from requests
        - G203 # template.HTML: a CMS renders trusted, already-sanitized HTML on purpose
        - G301 # directory permissions 0755: uploads must be readable by the web server
        - G302
        - G306
        - G115 # integer conversion overflow: sizes and IDs are bounded
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
