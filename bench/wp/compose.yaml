# WordPress stack for `make bench` (bench/run.py). nginx + php-fpm 8.3 (official image, OPcache on
# with the image's recommended settings) + MariaDB 11.4 LTS, plus Redis for the "tuned" setup.
# Limits per tier are the same as the Pursae stack (app 2 CPU / 1 GiB, database 1 CPU / 1 GiB);
# nginx and Redis are WordPress-only extras and get their own allowance on top.
name: bench-wp

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    command: ${WP_DB_ARGS:-}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
    deploy: {resources: {limits: {cpus: "1", memory: 1g}}}

  redis:
    image: redis:7-alpine
    profiles: ["tuned"]
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}

  php:
    image: bench-wp-php:7.1.4-php8.3
    build: ./php
    depends_on: {db: {condition: service_healthy}}
    environment: &wpenv
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # No loopback wp-cron on page views (run.py runs due events with WP-CLI); Redis host for the tuned setup.
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('WP_REDIS_HOST', 'redis');
    volumes:
      - html:/var/www/html
      - ./php/${WP_FPM_POOL:-stock}.conf:/usr/local/etc/php-fpm.d/zz-bench.conf:ro
    deploy: {resources: {limits: {cpus: "2", memory: 1g}}}

  nginx:
    image: nginx:1.27-alpine
    depends_on: [php]
    ports: ["127.0.0.1:${WP_PORT:-18081}:80"]
    volumes:
      - html:/var/www/html:ro
      - ./nginx/${WP_NGINX:-default}.conf:/etc/nginx/conf.d/default.conf:ro
    deploy: {resources: {limits: {cpus: "1", memory: 256m}}}

  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    user: "33:33"
    environment:
      <<: *wpenv
      HOME: /tmp
    volumes:
      - html:/var/www/html
      - ./:/bench-wp:ro
      - ${BENCH_CONTENT:-../content/out}:/content:ro

volumes:
  db:
  html:
