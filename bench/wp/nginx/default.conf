# developer.wordpress.org/advanced-administration/server/web-server/nginx/ (the basic WordPress server block).
upstream php { server php:9000; }
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 64m;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt { log_not_found off; access_log off; allow all; }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg|woff2?)$ { expires max; log_not_found off; }
}
