# The basic WordPress server block plus the WP Super Cache rules for nginx (serve the static
# supercache file without PHP), from the WordPress.org nginx guide and the plugin's documentation.
upstream php { server php:9000; }
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 64m;
    gzip on;
    gzip_static on;  # WP Super Cache writes index.html.gz next to index.html (cache_compression)
    open_file_cache max=10000 inactive=60s;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $cache_uri $request_uri;
    if ($request_method = POST) { set $cache_uri 'null cache'; }
    if ($query_string != "") { set $cache_uri 'null cache'; }
    if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|/wp-(app|cron|login|register|mail).php|wp-.*.php|/feed/|index.php|wp-comments-popup.php|wp-links-opml.php|wp-locations.php|sitemap(_index)?.xml|[a-z0-9_-]+-sitemap([0-9]+)?.xml)") { set $cache_uri 'null cache'; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") { set $cache_uri 'null cache'; }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt { log_not_found off; access_log off; allow all; }
    location / {
        try_files /wp-content/cache/supercache/$host/$cache_uri/index.html $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg|woff2?)$ { expires max; log_not_found off; }
}
