# Production override for compose.yaml. Start with:
#
#   PURSAE_DB_PASSWORD=... PURSAE_SITE_URL=https://example.com \
#     docker compose -f docker/compose.yaml -f docker/compose.prod.yaml up -d --build
#
# - the database password comes from PURSAE_DB_PASSWORD (letters and digits keep the URL simple; URL-encode
#   anything else). POSTGRES_PASSWORD only applies when the pgdata volume is created: for an existing
#   database change the password first (ALTER USER wpgo PASSWORD '...').
# - PostgreSQL is not published on the host.
# - the demo signing key is not trusted; list your own keys in PURSAE_PLUGIN_KEYS.
# - a production binary (no devhub tag) always talks to https://hub.pursae.com and trusts only Manager
#   keys endorsed by the pinned release root; PURSAE_DEV_HUB_URL / PURSAE_TRUST_HUB_KEYS are removed below.
# - PURSAE_SITE_URL is required: it is the public https:// address behind your TLS proxy.
# - the site is published on 127.0.0.1:${PURSAE_PORT:-${WPGO_PORT:-8088}} only: put your TLS proxy on this host (or set
#   PURSAE_BIND to another address). Clients must not reach the server directly, or they could send their
#   own X-Forwarded-For. PURSAE_TRUSTED_PROXIES lists the proxy addresses whose X-Forwarded-For is believed
#   (default: loopback and private networks, which includes the Docker bridge the host proxy comes from).
name: wpgo

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${PURSAE_DB_PASSWORD:-${WPGO_DB_PASSWORD:?set PURSAE_DB_PASSWORD}}
    ports: !reset []
    restart: unless-stopped

  wpgo:
    build:
      args:
        GO_TAGS: ""
    environment:
      PURSAE_DEV_HUB_URL: !reset null
      PURSAE_TRUST_HUB_KEYS: !reset null
      DATABASE_URL: postgres://wpgo:${PURSAE_DB_PASSWORD:-${WPGO_DB_PASSWORD:?set PURSAE_DB_PASSWORD}}@db:5432/wpgo?sslmode=disable
      PURSAE_SITE_URL: ${PURSAE_SITE_URL:-${WPGO_SITE_URL:?set PURSAE_SITE_URL to the public https:// address}}
      PURSAE_TRUST_DEV_KEY: "0"
      PURSAE_PLUGIN_KEYS: ${PURSAE_PLUGIN_KEYS:-${WPGO_PLUGIN_KEYS:-}}
      PURSAE_TRUSTED_PROXIES: ${PURSAE_TRUSTED_PROXIES:-${WPGO_TRUSTED_PROXIES:-}}
      PURSAE_SETUP_TOKEN: ${PURSAE_SETUP_TOKEN:-${WPGO_SETUP_TOKEN:-}}
    ports: !override
      - "${PURSAE_BIND:-${WPGO_BIND:-127.0.0.1}}:${PURSAE_PORT:-${WPGO_PORT:-8088}}:8080"
    restart: unless-stopped
    # On SIGTERM the server drains requests (10 s), the job runner (10 s), background writes and the
    # pool (5 s each); Docker's default 10 s would kill a job or an upload half-way.
    stop_grace_period: 35s
    # GET /healthz (process up); `wpgo healthcheck ready` checks /readyz (database + migrations).
    healthcheck:
      test: ["CMD", "/usr/local/lib/pursae/wpgo", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
