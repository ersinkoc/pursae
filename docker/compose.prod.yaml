# Production override for compose.yaml. Start with:
#
#   WPGO_DB_PASSWORD=... WPGO_SITE_URL=https://example.com \
#     docker compose -f docker/compose.yaml -f docker/compose.prod.yaml up -d --build
#
# - the database password comes from WPGO_DB_PASSWORD (letters and digits keep the URL simple; URL-encode
#   anything else). POSTGRES_PASSWORD only applies when the pgdata volume is created: for an existing
#   database change the password first (ALTER USER wpgo PASSWORD '...').
# - PostgreSQL is not published on the host.
# - the demo signing key is not trusted; list your own keys in WPGO_PLUGIN_KEYS.
# - a production binary (no devhub tag) always talks to https://hub.pursae.com and trusts only Manager
#   keys endorsed by the pinned release root; WPGO_DEV_HUB_URL / WPGO_TRUST_HUB_KEYS are removed below.
# - WPGO_SITE_URL is required: it is the public https:// address behind your TLS proxy.
# - the site is published on 127.0.0.1:${WPGO_PORT:-8088} only: put your TLS proxy on this host (or set
#   WPGO_BIND to another address). Clients must not reach the server directly, or they could send their
#   own X-Forwarded-For. WPGO_TRUSTED_PROXIES lists the proxy addresses whose X-Forwarded-For is believed
#   (default: loopback and private networks, which includes the Docker bridge the host proxy comes from).
name: wpgo

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${WPGO_DB_PASSWORD:?set WPGO_DB_PASSWORD}
    ports: !reset []
    restart: unless-stopped

  wpgo:
    build:
      args:
        GO_TAGS: ""
    environment:
      WPGO_DEV_HUB_URL: !reset null
      WPGO_TRUST_HUB_KEYS: !reset null
      DATABASE_URL: postgres://wpgo:${WPGO_DB_PASSWORD:?set WPGO_DB_PASSWORD}@db:5432/wpgo?sslmode=disable
      WPGO_SITE_URL: ${WPGO_SITE_URL:?set WPGO_SITE_URL to the public https:// address}
      WPGO_TRUST_DEV_KEY: "0"
      WPGO_PLUGIN_KEYS: ${WPGO_PLUGIN_KEYS:-}
      WPGO_TRUSTED_PROXIES: ${WPGO_TRUSTED_PROXIES:-}
    ports: !override
      - "${WPGO_BIND:-127.0.0.1}:${WPGO_PORT:-8088}:8080"
    restart: unless-stopped
    # GET /healthz (process up); `wpgo healthcheck ready` checks /readyz (database + migrations).
    healthcheck:
      test: ["CMD", "/usr/local/lib/pursae/wpgo", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
