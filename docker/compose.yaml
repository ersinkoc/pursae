name: wpgo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wpgo
      POSTGRES_USER: wpgo
      POSTGRES_PASSWORD: wpgo
    ports:
      - "${WPGO_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpgo -d wpgo"]
      interval: 2s
      timeout: 3s
      retries: 30

  wpgo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${WPGO_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wpgo:wpgo@db:5432/wpgo?sslmode=disable
      WPGO_SITE_URL: ${WPGO_SITE_URL:-http://localhost:8088}
      WPGO_UPLOADS_DIR: /data/uploads
      # Demo only: trust the development signing key of the bundled example plugins.
      WPGO_TRUST_DEV_KEY: ${WPGO_TRUST_DEV_KEY:-1}
      # The Pursae Hub (marketplace, release checks); "off" disables it.
      WPGO_HUB_URL: ${WPGO_HUB_URL:-https://hub.wordpressgo.dev}
      # Development only: without a pinned release root key (ROOT_KEYS build arg), trust the keys the
      # Manager lists for core self-updates (internal/server/hub_trust.go).
      WPGO_TRUST_HUB_KEYS: ${WPGO_TRUST_HUB_KEYS:-1}
    ports:
      - "${WPGO_PORT:-8088}:8080"
    # A core update that does not start is rolled back on the next start (internal/coreupdate).
    restart: unless-stopped
    volumes:
      - bin:/data/bin # the running binary: Dashboard › Updates replaces it
      - uploads:/data/uploads
      - plugins:/data/plugins
      - themes:/data/themes # files edited in Appearance › Theme File Editor
      - pagecache:/data/wpgo-cache # Pursae Cache disk persistence (survives rebuilds)
      - languages:/data/languages # language packs downloaded from WordPress.org (Settings › General › Site Language)

  # Runs the Go test suite against the same Postgres: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: golang:1.27-alpine
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      WPGO_TEST_DB: postgres://wpgo:wpgo@db:5432/wpgo_test?sslmode=disable
      WPGO_TEST_ADMIN_DB: postgres://wpgo:wpgo@db:5432/wpgo?sslmode=disable
      CGO_ENABLED: "0"
      GOFLAGS: -mod=mod
    volumes:
      - ..:/src
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    command: ["go", "test", "./..."]

volumes:
  bin:
  pgdata:
  uploads:
  plugins:
  themes:
  pagecache:
  languages:
  gocache:
  gomod:
