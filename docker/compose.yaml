name: wpgo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wpgo
      POSTGRES_USER: wpgo
      POSTGRES_PASSWORD: wpgo
    ports:
      # Development: published on this machine only (tests and `make dev` use localhost:5432).
      - "127.0.0.1:${WPGO_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpgo -d wpgo"]
      interval: 2s
      timeout: 3s
      retries: 30

  wpgo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${WPGO_VERSION:-}
        # Development build: the Manager URL and key trust below are read only by -tags devhub binaries.
        GO_TAGS: ${WPGO_GO_TAGS:-devhub}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wpgo:wpgo@db:5432/wpgo?sslmode=disable
      WPGO_SITE_URL: ${WPGO_SITE_URL:-http://localhost:8088}
      WPGO_UPLOADS_DIR: /data/uploads
      # Demo only: trust the development signing key of the bundled example plugins.
      WPGO_TRUST_DEV_KEY: ${WPGO_TRUST_DEV_KEY:-1}
      # Development only (devhub builds): the Pursae Manager to use instead of https://hub.pursae.com,
      # by default the local one (pursae-manager on :8090 on the host, reached through the
      # pursae-manager.test alias below: plain http is only allowed for localhost / *.localhost /
      # *.test hosts); "off" disables it.
      WPGO_DEV_HUB_URL: ${WPGO_DEV_HUB_URL:-http://pursae-manager.test:8090}
      # Proxies whose X-Forwarded-For is believed (empty: loopback and private networks; "none": nobody).
      WPGO_TRUSTED_PROXIES: ${WPGO_TRUSTED_PROXIES:-}
      # off: never contact hub.pursae.com (no updates, marketplace or licenses; not recommended).
      WPGO_HUB: ${WPGO_HUB:-}
      # Development only (devhub builds): trust every key the Manager lists, endorsed by the release
      # root or not, so a local Manager's throwaway key verifies updates (internal/server/hub_trust.go).
      WPGO_TRUST_HUB_KEYS: ${WPGO_TRUST_HUB_KEYS:-1}
      # Outgoing mail (password resets, notifications). Without WPGO_SMTP_HOST messages are only
      # written as .eml files to /data/mail.
      WPGO_SMTP_HOST: ${WPGO_SMTP_HOST:-}
      WPGO_SMTP_PORT: ${WPGO_SMTP_PORT:-587}
      WPGO_SMTP_USER: ${WPGO_SMTP_USER:-}
      WPGO_SMTP_PASS: ${WPGO_SMTP_PASS:-}
      WPGO_MAIL_FROM: ${WPGO_MAIL_FROM:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # The host's Pursae Manager under a *.test name, so the site's http rule accepts it.
      - "pursae-manager.test:host-gateway"
    ports:
      - "${WPGO_PORT:-8088}:8080"
    # A core update that does not start is rolled back on the next start (internal/coreupdate).
    restart: unless-stopped
    volumes:
      - bin:/data/bin # the running binary: Dashboard › Updates replaces it
      - uploads:/data/uploads
      - plugins:/data/plugins
      - themes:/data/themes # files edited in Appearance › Theme File Editor
      - pagecache:/data/wpgo-cache # Pursae Cache disk persistence (survives rebuilds)
      - languages:/data/languages # language packs downloaded from WordPress.org (Settings › General › Site Language)
      - backups:/data/backups # Tools › Backups archives (scheduled and manual)
      - mail:/data/mail # .eml files of messages sent without SMTP

  # Runs the Go test suite against the same Postgres: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: golang:1.27-alpine
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      WPGO_TEST_DB: postgres://wpgo:wpgo@db:5432/wpgo_test?sslmode=disable
      WPGO_TEST_ADMIN_DB: postgres://wpgo:wpgo@db:5432/wpgo?sslmode=disable
      CGO_ENABLED: "0"
      GOFLAGS: -mod=mod
    volumes:
      - ..:/src
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    command: ["go", "test", "./..."]

volumes:
  bin:
  pgdata:
  uploads:
  plugins:
  themes:
  pagecache:
  languages:
  backups:
  mail:
  gocache:
  gomod:
