{{define "admin/plugin-settings"}}{{template "admin-header" .}}{{with .Data}}
<div class="wrap">
<h1>{{.Page.PageTitle}}</h1>
{{template "notices" $}}
{{with .Page.Description}}<p>{{.}}</p>{{end}}
<form method="post" action="/wp-admin/options" novalidate="novalidate">
<input type="hidden" name="option_page" value="plugin:{{.Slug}}" /><input type="hidden" name="action" value="update" />
<input type="hidden" name="_wpnonce" value="{{.Nonce}}" />
<table class="form-table" role="presentation">
{{range .Fields}}{{.Row}}{{end}}</table>
<p class="submit"><input type="submit" name="submit" id="submit" class="button button-primary" value="Save Changes" /></p>
</form>
</div>
{{end}}{{template "admin-footer" .}}{{end}}
