<div class="pk-posts">
	{{range $p := .Posts}}<article id="post-{{.ID}}" class="{{.Class}} pk-post-card">
		{{with .Thumbnail}}<a class="pk-post-card__media" href="{{$p.Permalink}}" aria-hidden="true" tabindex="-1">{{.}}</a>{{end}}
		<div class="pk-post-card__text">
			<p class="pk-kicker"><span class="pk-tag">{{with .Categories}}{{(index . 0).Name}}{{else}}Field notes{{end}}</span> <time datetime="{{.DateISO}}">{{.DateText}}</time></p>
			<h2 class="pk-post-card__title"><a href="{{.Permalink}}" rel="bookmark">{{.Title}}</a></h2>
			{{if .ShowExcerpt}}<div class="pk-post-card__excerpt">{{.Excerpt}}</div>{{end}}
		</div>
	</article>
	{{end}}
</div>
