		<h1 class="page-title">This page ran off chasing a squirrel.</h1>
		<p>We could not find what you were looking for. A search usually brings it back. <a href="{{.HomeURL}}">Back to the home page</a>.</p>
		{{template "searchform" .}}
	</section><!-- .error-404 -->
</main>
{{template "footer" .}}
