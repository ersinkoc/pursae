{{template "header" .}}
<main id="main" class="site-main site-main--404" tabindex="-1">
	<section class="error-404 not-found wrap wrap--content">
		<p class="error-404__code" aria-hidden="true">404</p>
		<h1 class="page-title">We could not route that request.</h1>
		<p>The page may have moved during a recent update. Search the site or return to the <a href="{{.HomeURL}}">home page</a>.</p>
		{{template "searchform" .}}
	</section><!-- .error-404 -->
</main>
{{template "footer" .}}
