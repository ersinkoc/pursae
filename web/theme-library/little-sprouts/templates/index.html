{{template "header" .}}
<header class="ls-wrap page-header">
	<p class="ls-kicker">{{if .IsHomeHeader}}For families{{else}}What's new{{end}}</p>
	<h1 class="page-title">{{if .IsHomeHeader}}{{.PostsPageTitle}}{{else}}Latest news{{end}}</h1>
</header>
<div class="ls-wrap ls-layout">
	<div class="ls-primary">
		{{if .Posts}}{{template "loop" .}}
		{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
	</div>
	{{template "sidebar" .}}
</div>
{{template "footer" .}}
