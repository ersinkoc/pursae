<!doctype html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<title>{{.DocumentTitle}}</title>
{{.Head}}</head>

<body class="{{.BodyClass}}">
{{.BodyOpen}}<div id="page" class="site">
	<a class="skip-link screen-reader-text" href="#main">Skip to content</a>

	<header id="masthead" class="site-header">
		<div class="site-header__inner qh-column">
			<div class="site-branding">
				{{with .CustomLogo}}<div class="site-logo">{{.}}</div>{{end}}
				{{if .TitleIsH1}}<h1 class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></h1>{{else}}<p class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></p>{{end}}
				{{with .Description}}<p class="site-description">{{.}}</p>{{end}}
			</div><!-- .site-branding -->
			<div class="site-header__tools">
				{{if has_nav_menu . "primary"}}<nav id="site-navigation" class="main-navigation" aria-label="Primary menu">
					<button type="button" class="menu-toggle qh-textbutton" aria-controls="menu-primary-menu" aria-expanded="false">menu</button>
					{{nav_menu . "primary"}}
				</nav><!-- #site-navigation -->{{end}}
				<button type="button" class="scheme-toggle qh-textbutton" aria-pressed="false" title="Switch between light and dark">
					<span class="scheme-toggle__icon" aria-hidden="true"></span><span class="scheme-toggle__label">dark</span><span class="screen-reader-text"> mode</span>
				</button>
			</div>
		</div>
	</header><!-- #masthead -->

	<div id="content" class="site-content">
		<main id="main" class="site-main qh-column" tabindex="-1">
