{{template "header" .}}
<header class="page-header">
	<h1 class="page-title"><span class="page-title__label">search /</span> <span class="search-term">{{.SearchQuery}}</span></h1>
	<p class="page-count">{{plural .TotalPosts "%s result" "%s results"}}</p>
	{{template "searchform" .}}
</header><!-- .page-header -->
{{if .Posts}}{{template "post-list" .}}
{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
{{template "footer" .}}
