<form role="search" method="get" class="search-form" action="{{.HomeURL}}">
	<label for="search-field-{{with .ID}}{{.}}{{else}}main{{end}}" class="screen-reader-text">Search for:</label>
	<input type="search" id="search-field-{{with .ID}}{{.}}{{else}}main{{end}}" class="search-field" placeholder="Search the news&hellip;" value="{{.SearchQuery}}" name="s" />
	<button type="submit" class="search-submit"><span class="screen-reader-text">Search</span><svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
</form>
