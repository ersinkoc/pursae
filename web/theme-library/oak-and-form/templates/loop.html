<div class="of-posts">
	{{range $i, $p := .Posts}}<article id="post-{{.ID}}" class="{{.Class}} of-post-card{{if eq $i 0}} of-post-card--lead{{end}}">
		{{with .Thumbnail}}<a class="of-post-card__media" href="{{$p.Permalink}}" aria-hidden="true" tabindex="-1">{{.}}</a>{{end}}
		<div class="of-post-card__text">
			<p class="of-kicker">{{with .Categories}}{{(index . 0).Name}}{{else}}Journal{{end}} <span aria-hidden="true">/</span> <time datetime="{{.DateISO}}">{{.DateText}}</time></p>
			<h2 class="of-post-card__title"><a href="{{.Permalink}}" rel="bookmark">{{.Title}}</a></h2>
			{{if .ShowExcerpt}}<div class="of-post-card__excerpt">{{.Excerpt}}</div>{{end}}
			<a class="of-more" href="{{.Permalink}}">Read the story<span class="screen-reader-text">: {{.Title}}</span></a>
		</div>
	</article>
	{{end}}
</div>
