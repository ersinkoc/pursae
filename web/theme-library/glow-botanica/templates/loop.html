<div class="gb-posts">
	{{range $p := .Posts}}<article id="post-{{.ID}}" class="{{.Class}} gb-post-card">
		{{with .Thumbnail}}<a class="gb-post-card__media" href="{{$p.Permalink}}" aria-hidden="true" tabindex="-1">{{.}}</a>{{end}}
		<div class="gb-post-card__text">
			<p class="gb-kicker">{{with .Categories}}{{(index . 0).Name}}{{else}}Journal{{end}} &middot; <time datetime="{{.DateISO}}">{{.DateText}}</time></p>
			<h2 class="gb-post-card__title"><a href="{{.Permalink}}" rel="bookmark">{{.Title}}</a></h2>
			{{if .ShowExcerpt}}<div class="gb-post-card__excerpt">{{.Excerpt}}</div>{{end}}
			<a class="gb-more" href="{{.Permalink}}">Read the note<span class="screen-reader-text">: {{.Title}}</span></a>
		</div>
	</article>
	{{end}}
</div>
