{{template "header" .}}
<div class="page-intro">
	<div class="wrap">
		<p class="page-intro__count">{{plural .TotalPosts "%s result" "%s results"}}</p>
		<h1 class="page-title">Search: <span class="search-term">{{.SearchQuery}}</span></h1>
		<div class="page-intro__search">{{template "searchform" .}}</div>
	</div>
</div>
<div class="wrap layout">
	<main id="main" class="site-main" tabindex="-1">
		{{if .Posts}}<div class="post-list">
			{{range .Posts}}{{template "content" .}}
			{{end}}
		</div>
		{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
	</main><!-- #main -->
	{{template "sidebar" .}}
</div>
{{template "footer" .}}
