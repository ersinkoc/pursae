{{template "header" .}}
<div class="page-intro">
	<div class="wrap">
		{{if .IsHomeHeader}}<p class="kicker">Perspectives</p>
		<h1 class="page-title">{{.PostsPageTitle}}</h1>{{else}}<p class="kicker">Latest</p>
		<p class="page-title">Insights &amp; news</p>{{end}}
	</div>
</div>
<div class="wrap layout">
	<main id="main" class="site-main" tabindex="-1">
		{{if .Posts}}<div class="post-list">
			{{range .Posts}}{{template "content" .}}
			{{end}}
		</div>
		{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
	</main><!-- #main -->
	{{template "sidebar" .}}
</div>
{{template "footer" .}}
