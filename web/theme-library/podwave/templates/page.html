{{template "header" .}}
{{with .Post}}<article id="post-{{.ID}}" class="{{.Class}} entry entry--page">
	<header class="pw-wrap pw-narrow entry-header">
		<h1 class="entry-title">{{.Title}}</h1>
	</header>
	{{with .Thumbnail}}<figure class="pw-wrap pw-narrow pw-page-image">{{.}}</figure>{{end}}
	<div class="pw-wrap pw-narrow entry-content">
		{{.Content}}
	</div>
	{{with .EditLink}}<footer class="pw-wrap pw-narrow entry-footer"><span class="edit-link">{{.}}</span></footer>{{end}}
</article>{{end}}
<div class="pw-wrap pw-narrow">{{template "comments" .}}</div>
{{template "footer" .}}
