{{template "header" .}}
<header class="pw-wrap page-header">
	<p class="pw-kicker">{{if .IsHomeHeader}}All episodes{{else}}Latest{{end}}</p>
	<h1 class="page-title">{{if .IsHomeHeader}}{{.PostsPageTitle}}{{else}}Fresh episodes{{end}}</h1>
</header>
<div class="pw-wrap pw-layout">
	<div class="pw-primary">
		{{if .Posts}}{{template "loop" .}}
		{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
	</div>
	{{template "sidebar" .}}
</div>
{{template "footer" .}}
