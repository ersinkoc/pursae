{{template "header" .}}
{{with .Post}}<article id="post-{{.ID}}" class="{{.Class}} entry entry--page">
	{{if .ThumbnailURL}}<figure class="fx-still fx-still--page"><img src="{{.ThumbnailURL}}" alt="" /></figure>{{end}}
	<header class="fx-wrap fx-narrow entry-header">
		<h1 class="entry-title">{{.Title}}</h1>
	</header>
	<div class="fx-wrap fx-narrow entry-content">
		{{.Content}}
	</div>
	{{with .EditLink}}<footer class="fx-wrap fx-narrow entry-footer"><span class="edit-link">{{.}}</span></footer>{{end}}
</article>{{end}}
<div class="fx-wrap fx-narrow">{{template "comments" .}}</div>
{{template "footer" .}}
