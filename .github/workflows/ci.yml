name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wpgo
          POSTGRES_USER: wpgo
          POSTGRES_PASSWORD: wpgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpgo -d wpgo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "0"
      WPGO_TEST_ADMIN_DB: postgres://wpgo:wpgo@localhost:5432/wpgo?sslmode=disable
      WPGO_TEST_DB: postgres://wpgo:wpgo@localhost:5432/wpgo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      # Development builds (make dev, the development compose file) compile the devhub files, which the
      # default build never sees.
      - name: vet and test (devhub build)
        run: |
          go vet -tags devhub ./...
          go test -tags devhub -count=1 ./internal/config
      # The release and Docker binary: static, -tags nodynamic (tools/release.sh, docker/Dockerfile).
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -o /dev/null ./cmd/wpgo
      # The plugin SDK and the example plugins compile to WASI reactors (tools/build-plugins.sh).
      - name: SDK and example plugins (wasip1)
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go vet ./sdk/... ./examples/plugins/...
          for d in examples/plugins/*/; do
            if [ -f "$d/plugin.json" ]; then go build -buildmode=c-shared -o /dev/null "./$d"; fi
          done
      # -p 1: the server, store and settings packages each drop and recreate WPGO_TEST_DB.
      - name: test
        run: go test ./... -p 1 -count=1 -timeout 40m

  # Data races in the unit tests (no database: the integration tests skip without WPGO_TEST_DB).
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test -race
        run: go test -race -count=1 -timeout 30m ./...

  # Pursae Web Builder: host unit tests, UI string lint, dist audit and BUILD.json against the pin
  # (make builder-test; needs the public builder/upstream submodule and Node 22).
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: builder/.nvmrc
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make builder-test
        run: make builder-test

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The Windows release binary: vet, unit tests (integration tests skip without WPGO_TEST_DB), then a
  # smoke run of the release build against the runner's preinstalled PostgreSQL: migrate, serve,
  # /healthz and the install screen.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
    steps:
      # Byte-identical checkout: golden files, patch hashes and templates are compared as LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test -count=1 -timeout 30m ./...
      - name: build (release flags)
        run: go build -trimpath -buildmode=exe -tags nodynamic -o pursae.exe ./cmd/wpgo
      - name: smoke run
        shell: pwsh
        env:
          DATABASE_URL: postgres://postgres:root@localhost:5432/postgres?sslmode=disable
          WPGO_ADDR: 127.0.0.1:8080
          WPGO_SITE_URL: http://127.0.0.1:8080
          WPGO_HUB: "off"
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          .\pursae.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\pursae.exe migrate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath .\pursae.exe -ArgumentList serve -PassThru -NoNewWindow -RedirectStandardError serve.err -RedirectStandardOutput serve.out
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            .\pursae.exe healthcheck 2>$null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { Get-Content serve.out, serve.err; exit 1 }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/wp-admin/install
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch "Pursae") { Write-Output $r.StatusCode; exit 1 }
          $r = Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -SkipHttpErrorCheck http://127.0.0.1:8080/
          Write-Output "front page: $($r.StatusCode)"
          Stop-Process -Id $p.Id
          Get-Content serve.err | Select-Object -Last 20
