name: Feature request
description: Suggest something Pursae should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas and questions, the [forum](https://pursae.com/forum/) is a good first stop.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. If WordPress or a WordPress plugin already does it, say which.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: input
    id: version
    attributes:
      label: Pursae version you use
      placeholder: Pursae 0.5.0
