{{template "header" .}}
{{with .Post}}<article id="post-{{.ID}}" class="{{.Class}} vr-article vr-page">
	<header class="vr-wrap vr-article__header">
		<h1 class="entry-title">{{.Title}}</h1>
	</header>
	{{with .Thumbnail}}<figure class="vr-article__media">{{.}}</figure>{{end}}
	<div class="vr-wrap vr-measure entry-content">
		{{.Content}}
	</div>
	{{with .EditLink}}<footer class="vr-wrap vr-measure entry-footer"><span class="edit-link">{{.}}</span></footer>{{end}}
</article>{{end}}
<div class="vr-wrap vr-measure">{{template "comments" .}}</div>
{{template "footer" .}}
