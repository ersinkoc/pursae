{{template "header" .}}
<section class="sc-wrap sc-narrow sc-404" aria-labelledby="sc-404-title">
	<p class="sc-404__code" aria-hidden="true">404</p>
	<h1 id="sc-404-title" class="sc-page-title">This page skipped class</h1>
	<p>We could not find it. Try a search, or start from the subject rooms.</p>
	{{template "searchform" .}}
	<p class="sc-actions">{{if forum_on}}<a class="sc-btn" href="{{forum_url . "index"}}">Open the forums</a>{{end}}<a class="sc-btn sc-btn--ghost" href="{{.HomeURL}}">Back to the home page</a></p>
</section>
{{template "footer" .}}
