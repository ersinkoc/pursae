<article id="post-{{.ID}}" class="{{.Class}} hd-article">
	<header class="hd-wrap hd-article__head">
		{{template "kicker" .}}
		<h1 class="hd-article__title">{{.Title}}</h1>
		{{if .ShowExcerpt}}<div class="hd-article__dek">{{.Excerpt}}</div>{{end}}
		{{template "meta" .}}
	</header>
	{{with .Thumbnail}}<figure class="hd-wrap hd-article__hero">{{.}}</figure>{{end}}
</article>
