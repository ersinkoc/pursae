<form role="search" method="get" class="search-form" action="{{.SearchAction}}">{{.SearchHidden}}
	<label class="search-form__label"><span class="screen-reader-text">Search for:</span>
	<input type="search" class="search-field" placeholder="What are you looking for?" value="{{.SearchQuery}}" name="s" /></label>
	<button type="submit" class="search-submit">Search</button>
</form>
