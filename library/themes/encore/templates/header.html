<!doctype html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>{{.DocumentTitle}}</title>
{{.Head}}</head>

<body class="{{.BodyClass}}">
{{.BodyOpen}}<div id="page" class="site">
	<a class="skip-link screen-reader-text" href="#main">Skip to content</a>

	<header id="masthead" class="site-header">
		<div class="ec-wrap site-header__inner">
			<div class="site-branding">
				{{with .CustomLogo}}<div class="site-logo">{{.}}</div>{{end}}
				{{if .TitleIsH1}}<h1 class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></h1>{{else}}<p class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></p>{{end}}
				{{with .Description}}<p class="site-description screen-reader-text">{{.}}</p>{{end}}
			</div><!-- .site-branding -->
			{{if has_nav_menu . "primary"}}<nav id="site-navigation" class="main-navigation" aria-label="Primary menu">
				<button type="button" class="menu-toggle" aria-controls="site-navigation" aria-expanded="false"><span class="ec-burger" aria-hidden="true"></span>Menu</button>
				{{nav_menu . "primary"}}
			</nav><!-- #site-navigation -->{{end}}
			{{with theme_mod . "cta_label"}}<a class="ec-btn ec-header-cta" href="{{theme_mod $ "cta_url"}}">{{.}}</a>{{end}}
		</div>
	</header><!-- #masthead -->

	<div id="content" class="site-content">
		<main id="main" class="site-main" tabindex="-1">
