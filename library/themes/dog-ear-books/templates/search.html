{{template "header" .}}
<div class="de-wrap">
	<header class="page-header">
		<p class="de-kicker">{{.TotalPosts}} {{plural .TotalPosts "result" "results"}}</p>
		<h1 class="page-title">Search results for &ldquo;{{.SearchQuery}}&rdquo;</h1>
	</header>
	{{if .Posts}}{{template "loop" .}}{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
</div>
{{template "footer" .}}
