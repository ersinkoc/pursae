{{template "header" .}}
<header class="page-header">
	<p class="page-kicker">{{plural .TotalPosts "%s result" "%s results"}}</p>
	<h1 class="page-title">Search: <span class="search-term">{{.SearchQuery}}</span></h1>
	{{template "searchform" .}}
</header><!-- .page-header -->
{{if .Posts}}{{template "gallery" .}}
{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
{{template "footer" .}}
