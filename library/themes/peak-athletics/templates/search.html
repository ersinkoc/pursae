{{template "header" .}}
<div class="pk-wrap pk-archive">
	<header class="page-header pk-page-header">
		<p class="pk-kicker">Search</p>
		<h1 class="page-title">Results for &ldquo;{{.SearchQuery}}&rdquo;</h1>
	</header>
	{{if .Posts}}{{template "loop" .}}{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
</div>
{{template "footer" .}}
