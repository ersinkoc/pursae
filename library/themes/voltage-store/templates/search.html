{{template "header" .}}
<div class="vt-wrap">
	<header class="page-header">
		<p class="vt-kicker">// {{.TotalPosts}} {{plural .TotalPosts "match" "matches"}}</p>
		<h1 class="page-title">Results for &ldquo;{{.SearchQuery}}&rdquo;</h1>
	</header>
	{{if .Posts}}{{template "loop" .}}{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
</div>
{{template "footer" .}}
