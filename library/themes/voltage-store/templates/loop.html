<div class="vt-posts">
	{{range $p := .Posts}}<article id="post-{{.ID}}" class="{{.Class}} vt-post-card">
		{{with .Thumbnail}}<a class="vt-post-card__media" href="{{$p.Permalink}}" aria-hidden="true" tabindex="-1">{{.}}</a>{{end}}
		<div class="vt-post-card__text">
			<p class="vt-kicker">{{with .Categories}}{{(index . 0).Name}}{{else}}Log{{end}} &middot; <time datetime="{{.DateISO}}">{{.DateText}}</time></p>
			<h2 class="vt-post-card__title"><a href="{{.Permalink}}" rel="bookmark">{{.Title}}</a></h2>
			{{if .ShowExcerpt}}<div class="vt-post-card__excerpt">{{.Excerpt}}</div>{{end}}
		</div>
	</article>
	{{end}}
</div>
