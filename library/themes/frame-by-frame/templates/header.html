<!doctype html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{.DocumentTitle}}</title>
{{.Head}}</head>

<body class="{{.BodyClass}}">
{{.BodyOpen}}<div id="page" class="site">
	<a class="skip-link screen-reader-text" href="#main">Skip to content</a>

	<header id="masthead" class="site-header">
		<div class="fx-topbar">
			<div class="fx-wrap fx-topbar__inner">
				<span class="fx-topbar__issue">{{with theme_mod . "issue_line"}}{{.}}{{end}}</span>
				<form role="search" method="get" class="fx-topbar__search" action="{{.HomeURL}}">
					<label><span class="screen-reader-text">Search for:</span><input type="search" name="s" value="{{.SearchQuery}}" placeholder="Search films, series, festivals" /></label>
				</form>
			</div>
		</div>
		<div class="fx-wrap site-header__inner">
			<div class="site-branding">
				{{with .CustomLogo}}<div class="site-logo">{{.}}</div>{{end}}
				{{if .TitleIsH1}}<h1 class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></h1>{{else}}<p class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></p>{{end}}
				{{with .Description}}<p class="site-description">{{.}}</p>{{end}}
			</div><!-- .site-branding -->
		</div>
		{{if has_nav_menu . "primary"}}<div class="fx-navbar">
			<nav id="site-navigation" class="main-navigation fx-wrap" aria-label="Primary menu">
				<button type="button" class="menu-toggle" aria-controls="site-navigation" aria-expanded="false"><span class="fx-burger" aria-hidden="true"></span>Sections</button>
				{{nav_menu . "primary"}}
			</nav><!-- #site-navigation -->
		</div>{{end}}
	</header><!-- #masthead -->

	<div id="content" class="site-content">
		<main id="main" class="site-main" tabindex="-1">
