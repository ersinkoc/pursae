<article id="post-{{.ID}}" class="{{.Class}} entry entry--single">
	<header class="entry-header">
		<h1 class="entry-title">{{.Title}}</h1>
		{{template "entry-meta" .}}
	</header><!-- .entry-header -->
	{{with .Thumbnail}}<figure class="post-thumbnail">{{.}}</figure>{{end}}
	<div class="entry-content">
		{{.Content}}
	</div><!-- .entry-content -->
	{{if or .Tags .EditLink}}<footer class="entry-footer">
		{{if .Tags}}<p class="tags-links"><span class="entry-footer__label">tagged</span> {{range $i, $t := .Tags}}{{if $i}} {{end}}<a href="{{$t.URL}}" rel="tag">#{{$t.Name}}</a>{{end}}</p>{{end}}
		{{with .EditLink}}<p class="edit-link">{{.}}</p>{{end}}
	</footer>{{end}}
	{{.Biography}}
</article><!-- #post-{{.ID}} -->
