<!doctype html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{.DocumentTitle}}</title>
{{.Head}}</head>

<body class="{{.BodyClass}}">
{{.BodyOpen}}<div id="page" class="site">
	<a class="skip-link screen-reader-text" href="#main">Skip to content</a>
	<div class="ribbon" aria-hidden="true"></div>
	<header id="masthead" class="site-header">
		<div class="wrap site-header__inner">
			<div class="site-branding">
				{{with .CustomLogo}}<div class="site-logo">{{.}}</div>{{else}}<span class="site-badge" aria-hidden="true"><span></span></span>{{end}}
				<div>
					{{if .TitleIsH1}}<h1 class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></h1>{{else}}<p class="site-title"><a href="{{.HomeURL}}" rel="home">{{.SiteName}}</a></p>{{end}}
					{{with .Description}}<p class="site-description">{{.}}</p>{{end}}
				</div>
			</div><!-- .site-branding -->
			{{if has_nav_menu . "primary"}}<nav id="site-navigation" class="main-navigation" aria-label="Primary menu">
				<button type="button" class="menu-toggle" aria-controls="primary-menu-wrap" aria-expanded="false"><span class="menu-toggle__bars" aria-hidden="true"><span></span></span><span class="menu-toggle__label">Menu</span></button>
				<div id="primary-menu-wrap" class="primary-menu-wrap">
					{{nav_menu . "primary"}}
					<form role="search" method="get" class="header-search" action="{{.SearchAction}}">{{.SearchHidden}}
						<label for="header-search-field" class="screen-reader-text">Search recipes</label>
						<input type="search" id="header-search-field" name="s" placeholder="Find a recipe&hellip;" value="{{.SearchQuery}}" />
						<button type="submit"><span class="screen-reader-text">Search</span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
					</form>
				</div>
			</nav><!-- #site-navigation -->{{end}}
		</div>
	</header><!-- #masthead -->
