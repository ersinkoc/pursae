{{template "header" .}}
<section class="gh-wrap gh-narrow gh-404" aria-labelledby="gh-404-title">
	<p class="gh-404__code" aria-hidden="true">404</p>
	<h1 id="gh-404-title" class="gh-page-title">You fell off the map</h1>
	<p>This page does not exist, or it moved to a new zone. Try a search, or head back to the hall.</p>
	{{template "searchform" .}}
	<p class="gh-actions">{{if forum_on}}<a class="gh-btn" href="{{forum_url . "index"}}">Open the forums</a>{{end}}<a class="gh-btn gh-btn--ghost" href="{{.HomeURL}}">Back to the home page</a></p>
</section>
{{template "footer" .}}
