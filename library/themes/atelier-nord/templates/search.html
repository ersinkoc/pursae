{{template "header" .}}
<header class="an-wrap page-header">
	<p class="an-label">Search / {{printf "%02d" .TotalPosts}}</p>
	<h1 class="page-title">&ldquo;{{.SearchQuery}}&rdquo;</h1>
	{{template "searchform" .}}
</header>
{{if .Posts}}{{template "work-list" .}}
<div class="an-wrap">{{.Pagination}}</div>{{else}}<div class="an-wrap">{{template "content-none" .}}</div>{{end}}
{{template "footer" .}}
