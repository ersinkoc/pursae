<article id="post-{{.ID}}" class="{{.Class}} entry entry--single">
	<header class="entry-header">
		{{if .Categories}}<p class="entry-cats">{{range .Categories}}<a class="cat-label" href="{{.URL}}" rel="category tag">{{.Name}}</a>{{end}}</p>{{end}}
		<h1 class="entry-title">{{.Title}}</h1>
		{{template "entry-meta" .}}
	</header><!-- .entry-header -->
	{{with .Thumbnail}}<figure class="post-thumbnail entry-thumb">{{.}}</figure>{{end}}
	<div class="entry-content">
		{{.Content}}
	</div><!-- .entry-content -->
	{{if or .Tags .EditLink}}<footer class="entry-footer">
		{{if .Tags}}<ul class="tag-pills" aria-label="Tags">{{range .Tags}}<li><a href="{{.URL}}" rel="tag">#{{.Name}}</a></li>{{end}}</ul>{{end}}
		{{with .EditLink}}<span class="edit-link">{{.}}</span>{{end}}
	</footer>{{end}}
	{{.Biography}}
</article><!-- #post-{{.ID}} -->
