<article id="post-{{.ID}}" class="{{.Class}} entry entry--page">
	<header class="entry-header">
		<h1 class="entry-title">{{.Title}}</h1>
		<span class="pt-flourish" aria-hidden="true">&#10086;</span>
	</header><!-- .entry-header -->
	{{with .Thumbnail}}<figure class="post-thumbnail post-thumbnail--page">{{.}}</figure>{{end}}
	<div class="entry-content">
		{{.Content}}
	</div><!-- .entry-content -->
	{{with .EditLink}}<footer class="entry-footer"><span class="edit-link">{{.}}</span></footer>{{end}}
</article><!-- #post-{{.ID}} -->
