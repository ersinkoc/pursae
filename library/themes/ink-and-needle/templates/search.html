{{template "header" .}}
<header class="in-wrap page-header page-header--search">
	<p class="in-kicker"><span class="in-star" aria-hidden="true">&#10022;</span> {{plural .TotalPosts "%s result" "%s results"}} <span class="in-star" aria-hidden="true">&#10022;</span></p>
	<h1 class="page-title">{{.SearchQuery}}</h1>
	{{template "searchform" .}}
</header>
<div class="in-wrap in-layout">
	<div class="in-primary">
		{{if .Posts}}{{template "loop" .}}
		{{.Pagination}}{{else}}{{template "content-none" .}}{{end}}
	</div>
	{{template "sidebar" .}}
</div>
{{template "footer" .}}
